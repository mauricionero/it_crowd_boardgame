<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playtest — The IT Crowd</title>
    <link rel="stylesheet" href="../tiles/tile-model.css">
    <link rel="stylesheet" href="../tokens/token-model.css">
    <link rel="stylesheet" href="card-model.css">
    <link rel="stylesheet" href="playtest-model.css">
  </head>
  <body>
    <header class="playtest-header">
      <h1>THE IT CROWD — Mesa de playtest</h1>
      <div class="playtest-dice" aria-label="Dados d6 customizados e d10">
        <div class="playtest-die" data-die data-die-type="d6" data-result="1" data-piece-id="die-1" role="button" tabindex="0" aria-label="Dado d6 1: falha bloqueada" title="Clique para rolar o dado"><span class="playtest-die__face">❌</span><span class="playtest-die__lock" aria-hidden="true">🔒</span></div>
        <div class="playtest-die playtest-die--d10" data-die data-die-type="d10" data-result="1" data-piece-id="die-d10-1" role="button" tabindex="0" aria-label="Dado d10 1: resultado 1" title="Clique para rolar o dado"><span class="playtest-die__face">1</span></div>
      </div>
      <div class="playtest-header-actions">
        <details class="playtest-card-menu" data-card-menu>
          <summary>+ Carta</summary>
          <div class="playtest-card-menu__panel" data-card-menu-categories></div>
        </details>
        <button type="button" class="playtest-add-die" data-add-die>+ 🎲 d6</button>
        <button type="button" class="playtest-add-die playtest-add-die--d10" data-add-d10>+ 🔺 d10</button>
        <div class="playtest-piece-trash" data-piece-trash aria-label="Lixeira de elementos">🗑️ Lixeira</div>
        <label class="playtest-setup-select">Ao resetar:
          <select data-setup-mode aria-label="Setup a carregar ao resetar">
            <option value="base">Só Porão</option>
            <option value="marketing">Porão + Andar 1</option>
          </select>
        </label>
        <button type="button" class="playtest-reset" data-reset-layout>Resetar posições</button>
      </div>
    </header>

    <main class="playtest-layout">
      <section class="playtest-board-panel" aria-label="Tabuleiro do playtest">
        <div class="playtest-board-stage">
          <section class="playtest-stress-ruler" aria-label="Régua The Boss Stress">
            <h2>THE BOSS<br>STRESS</h2>
            <div class="playtest-stress-scale" data-stress-scale></div>
          </section>
          <div class="playtest-board-group" data-board-group>
            <div class="playtest-board playtest-board--base" data-board="base">
              <img
                class="playtest-board__image"
                src="../../assets/boards/base/board-complete-18x12-v18.png"
                alt="Tabuleiro do Porão"
              >
              <section class="playtest-item-supply playtest-item-supply--cabinet" data-item-supply="cabinet" aria-label="Itens do armário">
                <div data-cabinet-tile aria-label="Tile do armário de suprimentos"></div>
                <div class="playtest-item-choices" data-equipment-choices></div>
              </section>
            </div>
            <div class="playtest-board playtest-board--floor-1" data-board="floor-1" hidden>
              <img
                class="playtest-board__image"
                src="../../assets/boards/floor-1/board-floor-1-16x11-v1.png"
                alt="Tabuleiro do Andar 1 — Marketing"
              >
            </div>
          </div>
        </div>
        <p class="playtest-board__caption">Área do cenário. As peças ainda são apenas referências posicionadas para o setup inicial.</p>
        <div class="playtest-kitchen-item-source" data-kitchen-item-deck aria-hidden="true"></div>
        <div class="playtest-deposit-item-source" data-deposit-item-deck aria-hidden="true"></div>
      </section>

      <aside class="playtest-side-panel" aria-label="Baralhos">
        <h2>Baralhos</h2>
        <section class="playtest-decks" data-decks aria-label="Baralhos empilhados"></section>
        <section class="playtest-side-materials" aria-label="Tokens, tiles e peões">
          <h3>Tokens e tiles</h3>
          <section class="playtest-side-material-group" aria-label="Tiles">
            <h4>Tiles</h4>
            <div class="playtest-materials playtest-materials--tiles" data-tiles aria-label="Todos os tiles disponíveis"></div>
          </section>
          <section class="playtest-side-material-group" aria-label="Tokens">
            <h4>Tokens</h4>
            <div class="playtest-materials playtest-materials--tokens" data-tokens aria-label="Todos os tokens disponíveis"></div>
          </section>
          <section class="playtest-side-material-group" aria-label="Peões">
            <h4>Peões</h4>
            <div class="playtest-material-pawns" data-material-pawns aria-label="Fichas de usuários e bombeiro"></div>
          </section>
        </section>
      </aside>

      <section class="playtest-priority-row" aria-label="Fila de iniciativa">
        <h2>Fila de iniciativa</h2>
        <div class="playtest-priority-queue" data-priority-queue aria-label="Cartas na fila de iniciativa">
          <span class="playtest-priority-star" data-piece-id="priority-star" aria-label="Estrela sobre a carta de Rotina">⭐</span>
        </div>
      </section>

      <section class="playtest-character-row" aria-label="Fichas dos personagens">
        <h2>Fichas dos personagens</h2>
        <div class="playtest-character-tableaus" data-character-tableaus></div>
      </section>

    </main>

    <script src="card-data.js"></script>
    <script src="card-renderer.js"></script>
    <script>
      window.ITCrowdUseExportedImages = true;
      window.ITCrowdExportedImageMode = 'full';
      window.ITCrowdExportedImageResolution = 'low';
      const { CARD_TYPES, cards } = window.ITCrowdCardData;
      const { createCard, createCardBack, createPlayerCharacterCard } = window.ITCrowdCardRenderer;
      const dieResults = [
        { face: '❌', label: 'falha bloqueada', blocked: true },
        { face: '❌', label: 'falha' },
        { face: '❌', label: 'falha' },
        { face: '❌', label: 'falha' },
        { face: '✅', label: 'sucesso' },
        { face: '✅', label: 'sucesso bloqueado', blocked: true },
      ];
      const POSITION_STORAGE_KEY = 'it-crowd-playtest-positions-v1';
      const INITIAL_BOARD_LAYOUT_VERSION = 4;
      const INITIAL_TILE_LAYOUT_VERSION = 3;
      const INITIAL_PAWN_LAYOUT_VERSION = 1;
      const INITIAL_KITCHEN_ITEM_LAYOUT_VERSION = 3;
      const INITIAL_PAPER_LAYOUT_VERSION = 4;
      const INITIAL_ACTION_LAYOUT_VERSION = 2;
      const INITIAL_ROUTINE_LAYOUT_VERSION = 2;
      const PRIORITY_LAYOUT_VERSION = 9;
      const PRIORITY_INITIAL_POSITIONS = [
        ['priority-star', -0.028, 1.135],
        ['priority-A1', -0.063, 1.179],
        ['priority-A4', -0.063, 1.529],
        ['deck-event-generic', 0.037, 1.179],
        ['initiative-B1', 0.147, 1.182],
        ['initiative-B2', 0.242, 1.182],
        ['initiative-B6', 0.337, 1.182],
        ['initiative-B3', 0.432, 1.182],
        ['deck-event-mission', 0.534, 1.182],
      ];
      const storedState = readStoredState();
      const storedPositions = storedState.positions;
      const storedDecks = storedState.decks;
      const storedDeckSetupMode = storedState.deckSetupMode;
      const storedRevealedCards = storedState.revealedCards;
      const storedManualPieces = storedState.manualPieces;
      const storedDice = storedState.dice;
      const storedDieTypes = storedState.dieTypes;
      const storedRemovedDice = storedState.removedDice;
      const storedRemovedPieces = storedState.removedPieces;
      let storedPriorityLayoutVersion = storedState.priorityLayoutVersion;
      let storedBoardLayoutVersion = storedState.boardLayoutVersion;
      let storedTileLayoutVersion = storedState.tileLayoutVersion;
      let storedPawnLayoutVersion = storedState.pawnLayoutVersion;
      let storedKitchenItemLayoutVersion = storedState.kitchenItemLayoutVersion;
      let storedPaperLayoutVersion = storedState.paperLayoutVersion;
      let storedActionLayoutVersion = storedState.actionLayoutVersion;
      let storedRoutineLayoutVersion = storedState.routineLayoutVersion;
      const setupMode = storedState.setupMode;
      const activeFloors = new Set(setupMode === 'marketing' ? ['B', '1'] : ['B']);

      function isActiveForSetup(card) {
        const requiredFloors = card.requiredFloors || [card.floor || 'B'];
        return requiredFloors.every((floor) => activeFloors.has(floor));
      }
      let revealedCardSequence = storedRevealedCards.reduce((highestSequence, record) => {
        const match = String(record.pieceId || '').match(/-(\d+)$/);
        const sequence = match ? Number(match[1]) : 0;
        return Math.max(highestSequence, sequence);
      }, 0);
      let topLayerIndex = 1000;
      const ALT_PREVIEW_Z_INDEX = 10000;

      function rememberLayerIndex(zIndex) {
        const numericZIndex = Number(zIndex);
        if (Number.isFinite(numericZIndex)) topLayerIndex = Math.max(topLayerIndex, numericZIndex);
      }

      function nextLayerIndex() {
        if (!Number.isFinite(topLayerIndex)) topLayerIndex = 1000;
        topLayerIndex += 1;
        return topLayerIndex;
      }

      function normalizeRevealedCards(records) {
        const usedPieceIds = new Set();

        return records.map((record, index) => {
          const originalPieceId = record.pieceId || `revealed-${record.code || 'card'}-${index + 1}`;
          let pieceId = originalPieceId;
          let recoveryIndex = 1;

          while (usedPieceIds.has(pieceId)) {
            recoveryIndex += 1;
            pieceId = `${originalPieceId}-recovered-${recoveryIndex}`;
          }

          usedPieceIds.add(pieceId);
          return pieceId === record.pieceId ? record : { ...record, pieceId };
        });
      }

      function readStoredState() {
        try {
          const parsed = JSON.parse(localStorage.getItem(POSITION_STORAGE_KEY) || '{}');
          const setupMode = parsed.setupMode === 'marketing' ? 'marketing' : 'base';
          if (parsed.positions || parsed.setupMode) {
            return {
              positions: parsed.positions || {},
              decks: parsed.decks || {},
              deckSetupMode: parsed.deckSetupMode || null,
              revealedCards: normalizeRevealedCards(parsed.revealedCards || []),
              manualPieces: parsed.manualPieces || [],
              dice: parsed.dice || [],
              dieTypes: parsed.dieTypes || {},
              removedDice: parsed.removedDice || [],
              removedPieces: parsed.removedPieces || [],
              priorityLayoutVersion: parsed.priorityLayoutVersion || 0,
              boardLayoutVersion: parsed.boardLayoutVersion || 0,
              tileLayoutVersion: parsed.tileLayoutVersion || 0,
              pawnLayoutVersion: parsed.pawnLayoutVersion || 0,
              kitchenItemLayoutVersion: parsed.kitchenItemLayoutVersion || 0,
              paperLayoutVersion: parsed.paperLayoutVersion || 0,
              actionLayoutVersion: parsed.actionLayoutVersion || 0,
              routineLayoutVersion: parsed.routineLayoutVersion || 0,
              setupMode,
            };
          }
          return { positions: parsed, decks: {}, deckSetupMode: null, revealedCards: [], manualPieces: [], dice: [], dieTypes: {}, removedDice: [], removedPieces: [], priorityLayoutVersion: 0, boardLayoutVersion: 0, tileLayoutVersion: 0, pawnLayoutVersion: 0, kitchenItemLayoutVersion: 0, paperLayoutVersion: 0, actionLayoutVersion: 0, routineLayoutVersion: 0, setupMode };
        } catch (error) {
          return { positions: {}, decks: {}, deckSetupMode: null, revealedCards: [], manualPieces: [], dice: [], dieTypes: {}, removedDice: [], removedPieces: [], priorityLayoutVersion: 0, boardLayoutVersion: 0, tileLayoutVersion: 0, pawnLayoutVersion: 0, kitchenItemLayoutVersion: 0, paperLayoutVersion: 0, actionLayoutVersion: 0, routineLayoutVersion: 0, setupMode: 'base' };
        }
      }

      function saveStoredState() {
        try {
          localStorage.setItem(POSITION_STORAGE_KEY, JSON.stringify({
            positions: storedPositions,
            decks: storedDecks,
            deckSetupMode: setupMode,
            revealedCards: storedRevealedCards,
            manualPieces: storedManualPieces,
            dice: storedDice,
            dieTypes: storedDieTypes,
            removedDice: storedRemovedDice,
            removedPieces: storedRemovedPieces,
            priorityLayoutVersion: storedPriorityLayoutVersion,
            boardLayoutVersion: storedBoardLayoutVersion,
            tileLayoutVersion: storedTileLayoutVersion,
            pawnLayoutVersion: storedPawnLayoutVersion,
            kitchenItemLayoutVersion: storedKitchenItemLayoutVersion,
            paperLayoutVersion: storedPaperLayoutVersion,
            actionLayoutVersion: storedActionLayoutVersion,
            routineLayoutVersion: storedRoutineLayoutVersion,
            setupMode,
          }));
        } catch (error) {
          // A sessão de playtest continua funcionando mesmo se o armazenamento estiver indisponível.
        }
      }

      function getPieceId(element) {
        return element.dataset.pieceId || element.closest('[data-piece-id]')?.dataset.pieceId;
      }

      function isPriorityPieceId(pieceId) {
        return pieceId === 'priority-star'
          || pieceId.startsWith('priority-A')
          || pieceId.startsWith('initiative-')
          || pieceId.startsWith('deck-event-');
      }

      function getPriorityQueueRelativePosition(left, top) {
        const queue = document.querySelector('[data-priority-queue]');
        if (!queue) return null;
        const queueRect = queue.getBoundingClientRect();
        if (!queueRect.width || !queueRect.height) return null;

        return {
          queueX: (left - (queueRect.left + window.scrollX)) / queueRect.width,
          queueY: (top - (queueRect.top + window.scrollY)) / queueRect.height,
        };
      }

      function buildStoredPosition(element, left, top, zIndex, boardAnchor = null) {
        const pieceId = getPieceId(element);
        const position = {
          ...storedPositions[pieceId],
          left,
          top,
          z: Number.isFinite(zIndex) ? zIndex : 1000,
        };
        const anchor = boardAnchor || position.boardAnchor;
        if (pieceId && anchor) {
          const board = document.querySelector(`.playtest-board--${anchor}`);
          if (board) {
            const boardRect = board.getBoundingClientRect();
            if (boardRect.width && boardRect.height) {
              position.boardAnchor = anchor;
              position.boardX = (left - (boardRect.left + window.scrollX)) / boardRect.width;
              position.boardY = (top - (boardRect.top + window.scrollY)) / boardRect.height;
            }
          }
        }
        if (pieceId && isPriorityPieceId(pieceId)) {
          const queuePosition = getPriorityQueueRelativePosition(left, top);
          if (queuePosition) Object.assign(position, queuePosition);
        }
        return position;
      }

      function resetPriorityLayoutIfNeeded() {
        if (storedPriorityLayoutVersion === PRIORITY_LAYOUT_VERSION) return;

        PRIORITY_INITIAL_POSITIONS.forEach(([pieceId]) => {
          delete storedPositions[pieceId];
          const removedIndex = storedRemovedPieces.indexOf(pieceId);
          if (removedIndex >= 0) storedRemovedPieces.splice(removedIndex, 1);
        });
        storedPriorityLayoutVersion = PRIORITY_LAYOUT_VERSION;
        saveStoredState();
      }

      function resetInitialBoardLayoutIfNeeded() {
        if (storedBoardLayoutVersion >= INITIAL_BOARD_LAYOUT_VERSION) return;

        ['character-PC1', 'character-PC2', 'character-PC3', 'character-PC4'].forEach((pieceId) => {
          delete storedPositions[pieceId];
        });
        Object.entries(storedPositions).forEach(([pieceId, position]) => {
          const zIndex = Number(position.z);
          if (zIndex >= 2200 && zIndex < 2250) delete storedPositions[pieceId];
        });
        storedBoardLayoutVersion = INITIAL_BOARD_LAYOUT_VERSION;
        saveStoredState();
      }

      function resetInitialTileLayoutIfNeeded() {
        if (storedTileLayoutVersion >= INITIAL_TILE_LAYOUT_VERSION) return;

        [
          'station-cabinet',
          'station-kitchen',
          'tile-G1-1',
          'tile-G1-2',
          'tile-G1-3',
          'tile-G1-4',
          'tile-G2-1',
          'tile-G4-1',
        ].forEach((pieceId) => delete storedPositions[pieceId]);
        storedTileLayoutVersion = INITIAL_TILE_LAYOUT_VERSION;
        saveStoredState();
      }

      function resetInitialPawnLayoutIfNeeded() {
        if (storedPawnLayoutVersion >= INITIAL_PAWN_LAYOUT_VERSION) return;

        delete storedPositions['pawn-P4'];
        storedPawnLayoutVersion = INITIAL_PAWN_LAYOUT_VERSION;
        saveStoredState();
      }

      function resetInitialKitchenItemLayoutIfNeeded() {
        if (storedKitchenItemLayoutVersion >= INITIAL_KITCHEN_ITEM_LAYOUT_VERSION) return;

        [
          'kitchen-item-H5-1',
          'kitchen-item-H4-1',
          'kitchen-item-H4-2',
          'kitchen-item-H1-1',
          'kitchen-item-H1-2',
          'kitchen-item-H1-3',
          'kitchen-item-H1-4',
        ].forEach((pieceId) => delete storedPositions[pieceId]);
        storedKitchenItemLayoutVersion = INITIAL_KITCHEN_ITEM_LAYOUT_VERSION;
        saveStoredState();
      }

      function resetInitialPaperLayoutIfNeeded() {
        if (storedPaperLayoutVersion >= INITIAL_PAPER_LAYOUT_VERSION) return;

        delete storedPositions['deposit-item-H17-1'];
        storedPaperLayoutVersion = INITIAL_PAPER_LAYOUT_VERSION;
        saveStoredState();
      }

      function resetInitialActionLayoutIfNeeded() {
        if (storedActionLayoutVersion >= INITIAL_ACTION_LAYOUT_VERSION) return;

        ['action-card', 'action-card-A5'].forEach((pieceId) => delete storedPositions[pieceId]);
        storedActionLayoutVersion = INITIAL_ACTION_LAYOUT_VERSION;
        saveStoredState();
      }

      function resetInitialRoutineLayoutIfNeeded() {
        if (storedRoutineLayoutVersion >= INITIAL_ROUTINE_LAYOUT_VERSION) return;

        delete storedPositions['priority-A4'];
        storedRoutineLayoutVersion = INITIAL_ROUTINE_LAYOUT_VERSION;
        saveStoredState();
      }

      function savePieceFace(element, property, value) {
        const pieceId = getPieceId(element);
        if (!pieceId) return;
        storedPositions[pieceId] = {
          ...storedPositions[pieceId],
          [property]: value,
        };
        saveStoredState();
      }

      function savePiecePosition(element) {
        const pieceId = getPieceId(element);
        const left = Number.parseFloat(element.style.left);
        const top = Number.parseFloat(element.style.top);
        if (!pieceId || !Number.isFinite(left) || !Number.isFinite(top)) return;
        const zIndex = Number.parseInt(element.style.zIndex, 10);
        storedPositions[pieceId] = buildStoredPosition(element, left, top, zIndex);
        const revealedCard = storedRevealedCards.find((card) => card.pieceId === pieceId);
        if (revealedCard) {
          revealedCard.left = left;
          revealedCard.top = top;
          revealedCard.z = Number.isFinite(zIndex) ? zIndex : 1000;
        }
        const manualPiece = storedManualPieces.find((piece) => piece.pieceId === pieceId);
        if (manualPiece) {
          manualPiece.left = left;
          manualPiece.top = top;
          manualPiece.z = Number.isFinite(zIndex) ? zIndex : 1000;
        }
        saveStoredState();
      }

      function logPiecePlacement(element) {
        const pieceId = getPieceId(element);
        const board = document.querySelector('.playtest-board');
        const left = Number.parseFloat(element.style.left);
        const top = Number.parseFloat(element.style.top);
        if (!pieceId || !board || !Number.isFinite(left) || !Number.isFinite(top)) return;

        const boardRect = board.getBoundingClientRect();
        const boardLeft = boardRect.left + window.scrollX;
        const boardTop = boardRect.top + window.scrollY;
        if (!boardRect.width || !boardRect.height) return;

        const relativeLeft = ((left - boardLeft) / boardRect.width).toFixed(3);
        const relativeTop = ((top - boardTop) / boardRect.height).toFixed(3);
        console.log(`place('${pieceId}', ${relativeLeft}, ${relativeTop});`);
      }

      function moveElementToDocumentPosition(element, left, top, zIndex = 1000) {
        const rect = element.getBoundingClientRect();
        const computedStyle = window.getComputedStyle(element);
        const isAbsolutelyPositioned = computedStyle.position === 'absolute' || computedStyle.position === 'fixed';

        if (!isAbsolutelyPositioned) {
          const placeholder = document.createElement('div');
          placeholder.className = 'playtest-drag-placeholder';
          placeholder.dataset.dragPlaceholderFor = getPieceId(element) || '';
          placeholder.style.width = `${rect.width}px`;
          placeholder.style.height = `${rect.height}px`;
          placeholder.style.flex = `0 0 ${rect.width}px`;
          element.parentNode.insertBefore(placeholder, element);
        }

        document.body.append(element);
        element.style.position = 'absolute';
        element.style.left = `${left}px`;
        element.style.top = `${top}px`;
        element.style.width = computedStyle.width;
        element.style.height = computedStyle.height;
        element.style.margin = '0';
        element.style.zIndex = String(zIndex);
        rememberLayerIndex(zIndex);
      }

      function restoreStoredPositions() {
        document.querySelectorAll('[data-piece-id]').forEach((element) => {
          const pieceId = element.dataset.pieceId;
          const position = storedPositions[pieceId];
          if (!position) return;
          const zIndex = Number.isFinite(position.z) ? position.z : 1000;
          topLayerIndex = Math.max(topLayerIndex, zIndex);
          let left = position.left;
          let top = position.top;
          if (!isPriorityPieceId(pieceId)
            && position.boardAnchor
            && Number.isFinite(position.boardX)
            && Number.isFinite(position.boardY)) {
            const board = document.querySelector(`.playtest-board--${position.boardAnchor}`);
            if (board) {
              const boardRect = board.getBoundingClientRect();
              left = boardRect.left + window.scrollX + boardRect.width * position.boardX;
              top = boardRect.top + window.scrollY + boardRect.height * position.boardY;
            }
          } else if (isPriorityPieceId(pieceId)
            && Number.isFinite(position.queueX)
            && Number.isFinite(position.queueY)) {
            const queue = document.querySelector('[data-priority-queue]');
            if (queue) {
              const queueRect = queue.getBoundingClientRect();
              left = queueRect.left + window.scrollX + queueRect.width * position.queueX;
              top = queueRect.top + window.scrollY + queueRect.height * position.queueY;
            }
          }
          moveElementToDocumentPosition(element, left, top, zIndex);
          if (isPriorityPieceId(pieceId)) {
            document.querySelectorAll(`[data-drag-placeholder-for="${pieceId}"]`).forEach((placeholder) => placeholder.remove());
          }
        });
      }

      function removeStoredPieces() {
        const removedPieceIds = new Set(storedRemovedPieces);
        document.querySelectorAll('[data-piece-id]').forEach((element) => {
          if (removedPieceIds.has(element.dataset.pieceId)) element.remove();
        });
      }

      function restoreStoredFaces() {
        document.querySelectorAll('.playtest-flippable-card').forEach((card) => {
          const pieceId = getPieceId(card);
          if (storedPositions[pieceId]?.flipped) {
            card.classList.add('playtest-card-is-flipped');
          }
        });

        document.querySelectorAll('.playtest-tile-face').forEach((tile) => {
          const face = storedPositions[getPieceId(tile)]?.face;
          if (face) setTileFace(tile, face);
        });

        document.querySelectorAll('.playtest-token-face').forEach((token) => {
          const face = storedPositions[getPieceId(token)]?.face;
          if (face) setTokenFace(token, face);
        });

        document.querySelectorAll('[data-die]').forEach((die) => {
          const result = storedPositions[getPieceId(die)]?.result;
          setDieResult(die, Number.isFinite(result) ? result - 1 : Number(die.dataset.result || 1) - 1);
        });
      }

      const deckDefinitions = [
        { label: 'Chamados', type: CARD_TYPES.CALL, preview: 'C1' },
        { label: 'Usuários', type: CARD_TYPES.USER, preview: 'D1' },
        { label: 'Eventos', type: CARD_TYPES.GENERIC_EVENT, preview: 'E1' },
        { label: 'Missões', type: CARD_TYPES.MISSION_EVENT, preview: 'I1' },
        { label: '🏆 Colecionáveis', type: CARD_TYPES.EQUIPMENT_ITEM, preview: 'H10', deckId: 'collection', filter: (card) => card.collectionOnly },
      ];

      function shuffle(entries) {
        const shuffled = [...entries];
        for (let index = shuffled.length - 1; index > 0; index -= 1) {
          const swapIndex = Math.floor(Math.random() * (index + 1));
          [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
        }
        return shuffled;
      }

      function makeFlippableCard(code, card, cardElement) {
        const back = createCardBack(code, card);
        back.classList.add('playtest-card-back-layer');
        cardElement.classList.add('playtest-flippable-card');
        cardElement.append(back);
        return cardElement;
      }

      function createPlaytestCard(code, card) {
        return makeFlippableCard(code, card, createCard(code, card));
      }

      function toggleCardFace(card) {
        if (!card) return;
        card.classList.toggle('playtest-card-is-flipped');
        const flipped = card.classList.contains('playtest-card-is-flipped');
        const revealedCard = storedRevealedCards.find((item) => item.pieceId === card.dataset.pieceId);
        if (revealedCard) {
          revealedCard.flipped = flipped;
        }
        savePieceFace(card, 'flipped', flipped);

      function setDieResult(die, resultIndex) {
        const isD10 = die.dataset.dieType === 'd10';
        const result = isD10 ? { face: '🔺', label: `resultado ${resultIndex + 1}` } : (dieResults[resultIndex] || dieResults[0]);
        die.dataset.result = String(resultIndex + 1);
        const face = document.createElement('span');
        face.className = 'playtest-die__face';
        face.textContent = isD10 ? String(resultIndex + 1) : result.face;
        die.replaceChildren(face);
        if (result.blocked) {
          const lock = document.createElement('span');
          lock.className = 'playtest-die__lock';
          lock.setAttribute('aria-hidden', 'true');
          lock.textContent = '🔒';
          die.append(lock);
        }
        die.setAttribute('aria-label', `${die.dataset.pieceId} ${isD10 ? 'd10' : 'd6'}: ${resultIndex + 1} — ${result.label}`);
        die.title = `Clique para rolar o dado · ${result.label}`;
      }

      function rollDie(die) {
        const resultCount = die.dataset.dieType === 'd10' ? 10 : dieResults.length;
        const value = Math.floor(Math.random() * resultCount);
        const finalRotation = `${(Math.random() * 30 - 15).toFixed(2)}deg`;
        window.clearTimeout(die.rollingTimeout);
        die.classList.remove('playtest-die--rolling');
        die.style.setProperty('--die-final-rotation', finalRotation);
        die.style.transform = 'rotate(0deg)';
        void die.offsetWidth;
        die.classList.add('playtest-die--rolling');
        die.rollingTimeout = window.setTimeout(() => {
          die.classList.remove('playtest-die--rolling');
          die.style.transform = `rotate(${finalRotation})`;
        }, 360);
        setDieResult(die, value);
        savePieceFace(die, 'result', value + 1);
      }

      function createDie(pieceId, dieType = 'd6') {
        const die = document.createElement('div');
        die.className = `playtest-die playtest-die--spawned${dieType === 'd10' ? ' playtest-die--d10' : ''}`;
        die.dataset.die = '';
        die.dataset.dieType = dieType;
        die.dataset.pieceId = pieceId;
        die.setAttribute('role', 'button');
        die.setAttribute('tabindex', '0');
        setDieResult(die, 0);
        return die;
      }

      function createRandomPieceId(prefix) {
        const randomId = window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        return `${prefix}-${randomId}`;
      }

      function removePlaytestElement(element) {
        const pieceId = getPieceId(element);
        if (!pieceId) return;

        if (element.matches('[data-die]')) {
          const storedDieIndex = storedDice.indexOf(pieceId);
          if (storedDieIndex >= 0) storedDice.splice(storedDieIndex, 1);
          delete storedDieTypes[pieceId];
          if (!storedRemovedDice.includes(pieceId)) storedRemovedDice.push(pieceId);
        }

        const storedCardIndex = storedRevealedCards.findIndex((card) => card.pieceId === pieceId);
        if (storedCardIndex >= 0) storedRevealedCards.splice(storedCardIndex, 1);

        const storedManualPieceIndex = storedManualPieces.findIndex((piece) => piece.pieceId === pieceId);
        if (storedManualPieceIndex >= 0) storedManualPieces.splice(storedManualPieceIndex, 1);

        if (!storedRemovedPieces.includes(pieceId)) storedRemovedPieces.push(pieceId);
        delete storedPositions[pieceId];
        document.querySelectorAll(`[data-drag-placeholder-for="${pieceId}"]`).forEach((placeholder) => placeholder.remove());
        element.remove();
        saveStoredState();
      }

      function isInsidePieceTrash(event) {
        const trash = document.querySelector('[data-piece-trash]');
        if (!trash) return false;
        const rect = trash.getBoundingClientRect();
        return event.clientX >= rect.left && event.clientX <= rect.right
          && event.clientY >= rect.top && event.clientY <= rect.bottom;
      }

      function createDeck(definition) {

        const deckEntries = Array.isArray(savedCodes)
          ? savedCodes.map((code) => [code, cards[code]]).filter(([, card]) => card && isActiveForSetup(card))

      const stressScale = document.querySelector('[data-stress-scale]');

      for (let value = 0; value <= 15; value += 1) {

      function createTableauPawn(definition) {

      const tileEntries = Object.entries(cards)

      const tokenEntries = Object.entries(cards)
        .filter(([, card]) => card.type === CARD_TYPES.TOKEN && isActiveForSetup(card));

      function createPlaytestTile(code, tileData, copyIndex) {
        const tile = document.createElement('article');
        tile.className = `tile-face playtest-tile-face tile-face--${tileData.front.tone}`;
        tile.title = `${code} · frente: ${tileData.front.tone} · verso: ${tileData.back.tone}`;
        tile.dataset.tileCode = code;
        tile.dataset.copy = String(copyIndex + 1);
        tile.dataset.pieceId = `tile-${code}-${copyIndex + 1}`;
        tile.dataset.face = 'front';
        tile.dataset.tone = tileData.front.tone;

        const content = document.createElement('div');
        content.className = 'tile-face__content';

        const icon = document.createElement('div');
        icon.className = `tile-face__icon ${tileData.front.iconClass ? `tile-face__icon--${tileData.front.iconClass}` : ''}`;
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = tileData.front.icon || '';

        content.append(icon);
        tile.append(content);
        return tile;

      function setTileFace(tile, faceName) {

        tile.dataset.face = faceName;

        tile.title = `${tile.dataset.tileCode} · ${faceName === 'front' ? 'frente' : 'verso'}: ${face.tone}`;

        icon.className = `tile-face__icon ${face.iconClass ? `tile-face__icon--${face.iconClass}` : ''}`;
        icon.textContent = face.icon || '';

        savePieceFace(tile, 'face', tile.dataset.face);

      const cabinetTile = createPlaytestTile('G5', cards.G5, 0);

      const materialPawnEntries = [

          pawn.dataset.pieceId = `pawn-${code}-${copyIndex + 1}`;

          const disc = document.createElement('div');
          disc.className = 'playtest-pawn__disc';
          disc.style.setProperty('--pawn-border', pawnData.borderColor);
          disc.style.setProperty('--pawn-fill', pawnData.fillColor);
          if (pawnData.imagePath) {
            const image = document.createElement('img');

            image.alt = pawnData.name;
            disc.append(image);
          } else if (pawnData.icon) {
            disc.textContent = pawnData.icon;
          }
          pawn.append(disc);
          document.querySelector('[data-material-pawns]').append(pawn);
        });

      function createPlaytestToken(code, tokenData, copyIndex) {
        const token = document.createElement('article');
        token.className = `token-face playtest-token-face token-face--${tokenData.front?.tone || 'initiative'}`;

      function createRevealedCard(code, card, record) {
        const revealedCard = createPlaytestCard(code, card);
        revealedCard.classList.add('playtest-revealed-card');
        revealedCard.dataset.revealedFrom = card.type.id;
        revealedCard.dataset.pieceId = record.pieceId;
        if (record.flipped) revealedCard.classList.add('playtest-card-is-flipped');

        const cardWidth = window.getComputedStyle(revealedCard).width;
        const cardHeight = window.getComputedStyle(revealedCard).height;
        document.body.append(revealedCard);
        revealedCard.style.position = 'absolute';
        revealedCard.style.left = `${record.left}px`;
        revealedCard.style.top = `${record.top}px`;
        revealedCard.style.width = cardWidth;
        revealedCard.style.height = cardHeight;
        revealedCard.style.margin = '0';
        const zIndex = Number.isFinite(record.z) ? record.z : 1000;
        topLayerIndex = Math.max(topLayerIndex, zIndex);
        revealedCard.style.zIndex = String(zIndex);
        makeDraggable(revealedCard, () => toggleCardFace(revealedCard));
        return revealedCard;

      function revealTopCard(deck) {
        const deckState = deck.playtestDeckState;
        if (!deckState.cards.length) return;

        const [code, card] = deckState.cards.shift();
        deck.playtestDeckCount.textContent = `${deckState.cards.length} cartas`;
        const deckRect = deck.getBoundingClientRect();
        const record = {
          pieceId: `revealed-${code}-${revealedCardSequence += 1}`,
          code,
          deckId: deck.dataset.pieceId,
          left: deckRect.left + window.scrollX,
          top: deckRect.top + window.scrollY,
          z: topLayerIndex + 1,
          flipped: false,
        };
        topLayerIndex = record.z;
        storedRevealedCards.push(record);
        saveDeckState(deck);
        saveStoredState();
        createRevealedCard(code, card, record);
      }

      function restoreRevealedCards() {
        storedRevealedCards.forEach((record) => {
          if (storedRemovedPieces.includes(record.pieceId)) return;
          const card = cards[record.code];
          if (card && isActiveForSetup(card)) createRevealedCard(record.code, card, record);
        });
      }

      function createManualCardInstance(code) {
        const card = cards[code];
        if (!card) return;

        const instanceIndex = storedRevealedCards.length;
        const record = {
          pieceId: createRandomPieceId(`card-${code}`),
          code,
          deckId: 'manual-card-menu',
          left: window.scrollX + Math.max(20, window.innerWidth / 2 - 120 + (instanceIndex % 6) * 18),
          top: window.scrollY + 160 + (instanceIndex % 8) * 18,
          z: topLayerIndex + 1,
          flipped: false,
        };
        topLayerIndex = record.z;
        storedRevealedCards.push(record);
        saveStoredState();
        createRevealedCard(code, card, record);
      }

      function createManualBoardPiece(code, pieceData, kind, record) {
        const element = kind === 'tile'
          ? createPlaytestTile(code, pieceData, 0)
          : createPlaytestToken(code, pieceData, 0);
        element.dataset.pieceId = record.pieceId;
        document.body.append(element);
        const computedStyle = window.getComputedStyle(element);
        element.style.position = 'absolute';
        element.style.left = `${record.left}px`;
        element.style.top = `${record.top}px`;
        element.style.zIndex = String(record.z);
        element.style.margin = '0';
        element.style.width = computedStyle.width;
        element.style.height = computedStyle.height;
        makeDraggable(element, () => (kind === 'tile' ? toggleTileFace(element) : toggleTokenFace(element)));
        return element;
      }

      function createManualPawnPiece(code, pawnData, record) {
        const pawn = document.createElement('article');
        pawn.className = 'playtest-material-pawn';
        pawn.dataset.pawnCode = code;
        pawn.dataset.pieceId = record.pieceId;
        pawn.title = pawnData.name;
        pawn.setAttribute('aria-label', pawnData.name);

        const disc = document.createElement('div');
        disc.className = 'playtest-pawn__disc';
        disc.style.setProperty('--pawn-border', pawnData.borderColor);
        disc.style.setProperty('--pawn-fill', pawnData.fillColor);
        if (pawnData.imagePath) {
          const image = document.createElement('img');
          image.src = pawnData.imagePath;
          image.alt = pawnData.name;
          disc.append(image);
        } else if (pawnData.icon) {
          disc.textContent = pawnData.icon;
        }
        pawn.append(disc);
        document.body.append(pawn);
        const computedStyle = window.getComputedStyle(pawn);
        pawn.style.position = 'absolute';
        pawn.style.left = `${record.left}px`;
        pawn.style.top = `${record.top}px`;
        pawn.style.zIndex = String(record.z);
        pawn.style.margin = '0';
        pawn.style.width = computedStyle.width;
        pawn.style.height = computedStyle.height;
        makeDraggable(pawn);
        return pawn;
      }

      function createManualBoardPieceInstance(code, kind) {
        const pieceData = cards[code];
        if (!pieceData) return;

        const instanceIndex = storedManualPieces.length;
        const record = {
          pieceId: createRandomPieceId(`${kind}-${code}`),
          code,
          kind,
          left: window.scrollX + Math.max(20, window.innerWidth / 2 - 120 + (instanceIndex % 6) * 18),
          top: window.scrollY + 160 + (instanceIndex % 8) * 18,
          z: topLayerIndex + 1,
        };
        topLayerIndex = record.z;
        storedManualPieces.push(record);
        saveStoredState();
        createManualBoardPiece(code, pieceData, kind, record);
      }

      function createManualPawnInstance(code, pawnData) {
        const instanceIndex = storedManualPieces.length;
        const record = {
          pieceId: createRandomPieceId(`pawn-${code}`),
          code,
          kind: 'pawn',
          left: window.scrollX + Math.max(20, window.innerWidth / 2 - 120 + (instanceIndex % 6) * 18),
          top: window.scrollY + 160 + (instanceIndex % 8) * 18,
          z: topLayerIndex + 1,
        };
        topLayerIndex = record.z;
        storedManualPieces.push(record);
        saveStoredState();
        createManualPawnPiece(code, pawnData, record);
      }

      function restoreManualPieces() {
        storedManualPieces.forEach((record) => {
          if (storedRemovedPieces.includes(record.pieceId)) return;
          const pieceData = cards[record.code];
          if (pieceData && isActiveForSetup(pieceData) && (record.kind === 'tile' || record.kind === 'token' || record.kind === 'pawn')) {
            topLayerIndex = Math.max(topLayerIndex, record.z || 1000);
            if (record.kind === 'pawn') {
              createManualPawnPiece(record.code, pieceData, record);
            } else {
              createManualBoardPiece(record.code, pieceData, record.kind, record);
            }
          }
        });
      }

      function saveInitialPiecePosition(element, left, top, zIndex, boardAnchor = null) {
        if (!element) return;
        const pieceId = getPieceId(element);
        if (!pieceId) return;

        moveElementToDocumentPosition(element, left, top, zIndex);
        document.querySelectorAll(`[data-drag-placeholder-for="${pieceId}"]`).forEach((placeholder) => placeholder.remove());
        storedPositions[pieceId] = buildStoredPosition(element, left, top, zIndex, boardAnchor);
      }

      function applyInitialPrioritySetup() {
        const queue = document.querySelector('[data-priority-queue]');
        if (!queue) return;

        let zIndex = 2250;
        const priorityPieces = PRIORITY_INITIAL_POSITIONS
          .map(([pieceId]) => ({
            pieceId,
            element: document.querySelector(`[data-piece-id="${pieceId}"]`),
          }))
          .filter(({ element }) => element);
        const piecesToDetach = priorityPieces.filter(({ element }) => (
          window.getComputedStyle(element).position !== 'absolute'
          && window.getComputedStyle(element).position !== 'fixed'
        ));

        piecesToDetach.forEach(({ element }) => {
          moveElementToDocumentPosition(element, 0, 0, zIndex);
          document.querySelectorAll(`[data-drag-placeholder-for="${getPieceId(element)}"]`).forEach((placeholder) => placeholder.remove());
          zIndex += 1;
        });

        const piecesToPlace = priorityPieces.filter(({ pieceId }) => !storedPositions[pieceId]);

        // Remover os baralhos da coluna lateral primeiro estabiliza a altura da fila.
        const queueRect = queue.getBoundingClientRect();
        const queueTop = queueRect.top + window.scrollY;
        const queueCardTop = queueTop + 27;
        const queueLeft = queueRect.left + window.scrollX;
        const priorityGap = 8;
        let nextCardLeft = queueLeft;

        piecesToPlace
          .filter(({ pieceId }) => pieceId !== 'priority-star' && pieceId !== 'priority-A4')
          .forEach(({ pieceId, element }) => {
            const top = queueCardTop;
            const left = nextCardLeft;
            element.style.left = `${left}px`;
            element.style.top = `${top}px`;
            element.style.zIndex = String(zIndex);
            storedPositions[pieceId] = buildStoredPosition(element, left, top, zIndex);
            nextCardLeft += element.getBoundingClientRect().width + priorityGap;
            zIndex += 1;
          });

        const firstCard = piecesToPlace.find(({ pieceId }) => pieceId === 'priority-A1');
        if (firstCard) {
          const firstCardRect = firstCard.element.getBoundingClientRect();
          const star = piecesToPlace.find(({ pieceId }) => pieceId === 'priority-star');
          if (star) {
            const starRect = star.element.getBoundingClientRect();
            const left = firstCardRect.left + (firstCardRect.width - starRect.width) / 2;
            const top = queueTop;
            star.element.style.left = `${left}px`;
            star.element.style.top = `${top}px`;
            star.element.style.zIndex = String(zIndex);
            storedPositions[star.pieceId] = buildStoredPosition(star.element, left, top, zIndex);
            zIndex += 1;
          }
        }

        saveStoredState();
      }

      function ensureStackedActionCards() {
        const baseActionCard = document.querySelector('[data-piece-id="action-card"]');

          Number.isFinite(baseActionZIndex) ? baseActionZIndex : 0
        );
        baseActionCard.style.zIndex = String(topActionZIndex);
        storedPositions['action-card'] = buildStoredPosition(
          baseActionCard,
          Number.parseFloat(baseActionCard.style.left),
          Number.parseFloat(baseActionCard.style.top),

        );

      function syncBoardPieceScale() {
        const baseBoard = document.querySelector('.playtest-board--base');
        if (!baseBoard) return;
        document.querySelectorAll('[data-piece-id]').forEach((piece) => {
          const position = storedPositions[getPieceId(piece)];
          if (!position?.boardAnchor || isPriorityPieceId(getPieceId(piece))) return;
          const board = document.querySelector(`.playtest-board--${position.boardAnchor}`);
          if (!board || !Number.isFinite(position.boardX) || !Number.isFinite(position.boardY)) return;
          const boardRect = board.getBoundingClientRect();
          piece.style.left = `${boardRect.left + window.scrollX + boardRect.width * position.boardX}px`;
          piece.style.top = `${boardRect.top + window.scrollY + boardRect.height * position.boardY}px`;
        });
        const baseBoardWidthMm = Number.parseFloat(
          window.getComputedStyle(document.documentElement).getPropertyValue('--playtest-base-board-width')
        );
        const baseBoardWidthPx = baseBoardWidthMm * (96 / 25.4);
        const scale = baseBoard.getBoundingClientRect().width / baseBoardWidthPx;
        document.querySelectorAll('[data-board-piece="true"]').forEach((piece) => {
          piece.style.setProperty('--playtest-board-piece-scale', scale.toFixed(4));

      function buildCardMenu() {
        const menu = document.querySelector('[data-card-menu-categories]');
        cardMenuCategories.forEach((categoryDefinition) => {
          const category = document.createElement('details');
          category.className = 'playtest-card-menu__category';

          const summary = document.createElement('summary');
          summary.textContent = categoryDefinition.label;

          const cardList = document.createElement('div');
          cardList.className = 'playtest-card-menu__list';
          const menuEntries = categoryDefinition.kind === 'pawn'
            ? [
              { code: 'P6', card: cards.P6, menuCode: 'P6' },
              { code: 'P7', card: cards.P7, menuCode: 'P7' },
            ]
            : Object.entries(cards)
              .filter(([, card]) => categoryDefinition.types.includes(card.type))
              .filter(([, card]) => isActiveForSetup(card))
              .filter(([, card]) => categoryDefinition.kind !== 'token' || card.front)
              .map(([code, card]) => ({ code, card, menuCode: code }));

          menuEntries.forEach(({ code, card, menuCode }) => {
              const button = document.createElement('button');
              button.type = 'button';
              button.className = 'playtest-card-menu__card';
              button.dataset.cardCode = menuCode;
              const itemName = card.title || card.name || boardPieceNames[code] || card.front?.icon || code;
              button.textContent = `${menuCode} — ${String(itemName).replace(/\n/g, ' ')}`;
              button.addEventListener('click', () => {
                if (categoryDefinition.kind) {
                  if (categoryDefinition.kind === 'pawn') {
                    createManualPawnInstance(code, card);
                  } else {
                    createManualBoardPieceInstance(code, categoryDefinition.kind);
                  }
                } else {
                  createManualCardInstance(code);
                }
                document.querySelector('[data-card-menu]').open = false;
              });
              cardList.append(button);
            });

          category.append(summary, cardList);
          menu.append(category);
        });
      }

      let altPressed = false;
      let altPreviewTarget = null;
      let altPreviewElement = null;
      const DRAG_START_DISTANCE_PX = 1;
      let pieceContextMenu = null;

      function hidePieceContextMenu() {
        pieceContextMenu?.remove();
        pieceContextMenu = null;
      }

      function sendPieceToBack(element) {
        const pieceElements = [...document.querySelectorAll('[data-piece-id]')]
          .filter((piece) => !piece.closest('.playtest-alt-preview'));
        const zIndexes = pieceElements
          .map((piece) => Number.parseInt(piece.style.zIndex, 10))
          .filter(Number.isFinite);
        const lowestZIndex = zIndexes.length ? Math.min(...zIndexes) : 1000;
        element.style.zIndex = String(Math.max(1, lowestZIndex - 1));
        savePiecePosition(element);
        hidePieceContextMenu();
      }

      function showPieceContextMenu(element, clientX, clientY) {
        hidePieceContextMenu();

        const menu = document.createElement('div');
        menu.className = 'playtest-piece-context-menu';
        menu.dataset.pieceContextMenu = '';

        const sendToBackButton = document.createElement('button');
        sendToBackButton.type = 'button';
        sendToBackButton.className = 'playtest-piece-context-menu__button';
        sendToBackButton.innerHTML = '<span class="playtest-piece-context-menu__icon" aria-hidden="true">↙</span><span>Enviar para trás</span>';
        sendToBackButton.addEventListener('click', () => sendPieceToBack(element));
        menu.append(sendToBackButton);
        document.body.append(menu);

        const menuRect = menu.getBoundingClientRect();
        menu.style.left = `${Math.min(clientX, window.innerWidth - menuRect.width - 8)}px`;
        menu.style.top = `${Math.min(clientY, window.innerHeight - menuRect.height - 8)}px`;
        pieceContextMenu = menu;
        sendToBackButton.focus();
      }

      document.addEventListener('pointerdown', (event) => {
        if (!event.target.closest('[data-piece-context-menu]')) hidePieceContextMenu();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') hidePieceContextMenu();
      });

      function hideAltPreview() {
        altPreviewElement?.remove();
        altPreviewElement = null;
      }

      function showAltPreview(element) {
        if (!altPressed) return;
        hideAltPreview();

        const preview = document.createElement('div');
        preview.className = 'playtest-alt-preview';
        preview.style.zIndex = String(ALT_PREVIEW_Z_INDEX);
        const clone = element.cloneNode(true);
        clone.classList.remove('playtest-dragging');
        preview.append(clone);
        document.body.append(preview);
        altPreviewElement = preview;
      }

      function makeAltPreviewable(element) {
        element.addEventListener('pointerenter', () => {
          altPreviewTarget = element;
          showAltPreview(element);
        });
        element.addEventListener('pointerleave', () => {
          if (altPreviewTarget !== element) return;
          altPreviewTarget = null;
          hideAltPreview();
        });
      }

      window.addEventListener('keydown', (event) => {
        if (event.key !== 'Alt' || altPressed) return;
        altPressed = true;
        if (altPreviewTarget) showAltPreview(altPreviewTarget);
      });

      window.addEventListener('keyup', (event) => {
        if (event.key !== 'Alt') return;
        altPressed = false;
        hideAltPreview();
      });

      window.addEventListener('blur', () => {
        altPressed = false;
        hideAltPreview();
      });

      function makeDraggable(element, tapHandler = null) {
        makeAltPreviewable(element);
        element.classList.add('playtest-draggable');
        element.setAttribute('draggable', 'false');
        element.querySelectorAll('img').forEach((image) => {
          image.setAttribute('draggable', 'false');
        });

        element.addEventListener('pointerdown', (event) => {
          if (event.button !== 0) return;

          event.preventDefault();
          const rect = element.getBoundingClientRect();
          const startLeft = rect.left + window.scrollX;
          const startTop = rect.top + window.scrollY;
          let dragStarted = false;
          let moved = false;
          let finished = false;

          const startDrag = () => {
            dragStarted = true;
            const zIndex = nextLayerIndex();
            moveElementToDocumentPosition(element, startLeft, startTop, zIndex);
            element.classList.add('playtest-dragging');
          };

          const move = (moveEvent) => {
            if (Math.hypot(moveEvent.pageX - event.pageX, moveEvent.pageY - event.pageY) < DRAG_START_DISTANCE_PX) return;
            moved = true;
            if (!dragStarted) startDrag();
            element.style.left = `${startLeft + moveEvent.pageX - event.pageX}px`;
            element.style.top = `${startTop + moveEvent.pageY - event.pageY}px`;
            document.querySelector('[data-piece-trash]')?.classList.toggle(
              'playtest-piece-trash--hover',
              isInsidePieceTrash(moveEvent),
            );
          };

          const finish = (finishEvent) => {
            if (finished) return;
            finished = true;
            const droppedInTrash = dragStarted
              && finishEvent.type === 'pointerup'
              && isInsidePieceTrash(finishEvent);
            if (tapHandler && finishEvent.type === 'pointerup' && !moved && !droppedInTrash) {
              tapHandler();
            }
            if (element.hasPointerCapture?.(event.pointerId)) {
              element.releasePointerCapture(event.pointerId);
            }
            if (dragStarted) element.classList.remove('playtest-dragging');
            document.querySelector('[data-piece-trash]')?.classList.remove('playtest-piece-trash--hover');
            if (droppedInTrash) {
              removePlaytestElement(element);
            } else if (dragStarted) {
              savePiecePosition(element);
              logPiecePlacement(element);
            }
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', finish);
            window.removeEventListener('pointercancel', finish);
            window.removeEventListener('mouseup', finish);
            window.removeEventListener('blur', cancel);
          };

          const cancel = () => finish({ type: 'cancel', clientX: -Infinity, clientY: -Infinity });

          element.setPointerCapture?.(event.pointerId);
          window.addEventListener('pointermove', move);
          window.addEventListener('pointerup', finish, { once: true });
          window.addEventListener('pointercancel', finish, { once: true });
          window.addEventListener('mouseup', finish, { once: true });
          window.addEventListener('blur', cancel, { once: true });
        });

        element.addEventListener('contextmenu', (event) => {
          event.preventDefault();
          showPieceContextMenu(element, event.clientX, event.clientY);
        });
      }

      document.querySelectorAll([
        '.playtest-priority-star',
        '.playtest-stress-ruler__arrow',

      });

      document.querySelectorAll('.playtest-token-face').forEach((token) => {
        makeDraggable(token, () => toggleTokenFace(token));
      });

      document.querySelectorAll('.playtest-character-tableau__character-card, .playtest-character-tableau__initiative-card').forEach((card) => {
        makeDraggable(card, () => toggleCardFace(card));
      });

      document.querySelectorAll('.playtest-item-choice-shell').forEach((shell) => {
        makeDraggable(shell, () => toggleCardFace(shell.querySelector('.playtest-item-choice')));
      });

      document.querySelectorAll('.playtest-deck').forEach((deck) => {
        makeDraggable(deck, () => revealTopCard(deck));
      });

      storedRemovedDice.forEach((pieceId) => {
        const die = Array.from(document.querySelectorAll('[data-die]'))
          .find((candidate) => candidate.dataset.pieceId === pieceId);
        die?.remove();
      });

      const diceContainer = document.querySelector('.playtest-dice');
      storedDice.forEach((pieceId) => {
        if (document.querySelector(`[data-die][data-piece-id="${pieceId}"]`)) return;
        diceContainer?.append(createDie(pieceId, storedDieTypes[pieceId] || 'd6'));
      });

      document.querySelectorAll('[data-die]').forEach((die) => {
        makeDraggable(die, () => rollDie(die));
      });

      document.querySelector('[data-add-die]').addEventListener('click', () => {
        const pieceId = createRandomPieceId('die');
        const dieType = 'd6';
        const die = createDie(pieceId, dieType);
        storedDice.push(pieceId);
        storedDieTypes[pieceId] = dieType;
        diceContainer?.append(die);
        makeDraggable(die, () => rollDie(die));
        saveStoredState();
      });

      document.querySelector('[data-add-d10]').addEventListener('click', () => {
        const pieceId = createRandomPieceId('die');
        const dieType = 'd10';
        const die = createDie(pieceId, dieType);
        storedDice.push(pieceId);
        storedDieTypes[pieceId] = dieType;
        diceContainer?.append(die);
        makeDraggable(die, () => rollDie(die));
        saveStoredState();
      });

      const setupModeSelect = document.querySelector('[data-setup-mode]');
      setupModeSelect.value = setupMode;
      document.querySelector('[data-board="floor-1"]').hidden = setupMode !== 'marketing';

      function initializePlaytestLayout() {
        resetInitialBoardLayoutIfNeeded();
        resetInitialTileLayoutIfNeeded();
        resetInitialPawnLayoutIfNeeded();
        resetInitialKitchenItemLayoutIfNeeded();
        resetInitialPaperLayoutIfNeeded();
        resetInitialActionLayoutIfNeeded();
        resetInitialRoutineLayoutIfNeeded();
        syncStressRulerHeight();
        resetPriorityLayoutIfNeeded();
        removeStoredPieces();
        applyInitialBoardSetup();
        applyInitialPrioritySetup();
        applyInitialFloorOneCardSetup();
        restoreStoredPositions();
        ensureStackedActionCards();
        restoreRevealedCards();
        restoreManualPieces();
        restoreStoredFaces();
        syncBoardPieceScale();
        buildCardMenu();

        document.querySelector('[data-reset-layout]').addEventListener('click', () => {
          const selectedSetupMode = setupModeSelect.value;
          const selectedSetupName = selectedSetupMode === 'marketing'
            ? 'Porão + Andar 1 — Marketing'
            : 'Só Porão';
          if (!window.confirm(`Carregar o setup “${selectedSetupName}” e resetar todas as posições da mesa?`)) return;
          localStorage.setItem(POSITION_STORAGE_KEY, JSON.stringify({ setupMode: selectedSetupMode }));
          window.location.reload();
        });
      }

      window.addEventListener('resize', () => {
        syncStressRulerHeight();
        syncBoardPieceScale();
      });

      if (document.readyState === 'complete') {
        initializePlaytestLayout();
      } else {
        window.addEventListener('load', initializePlaytestLayout, { once: true });
      }
    </script>
  </body>
</html>
